openapi: 3.0.3
info:
  title: SPHEREx Explorer API
  version: 0.3.0-sprint3
  description: |
    Sprint 3 contract for SPHEREx Explorer.
    Default search/epochs path uses labeled fixtures under `data/metadata/`
    with provenance `stub` or `cached_sample` (offline demo / CI).
    When `SPHEREX_USE_IRSA=1` (or CatalogService `use_irsa=True`), the
    backend calls P4 `search_observations` (IRSA SIA2). Successful queries
    are labeled provenance `live`. IRSA failures fall back to fixtures.
    Epoch always includes obs_id, ra, dec, t_mjd, bandpass, wavelength_um,
    preview_url, provenance (nullable values where the row lacks them).
    For live rows only, optional `collection` and `source_url` are passed
    through from P4 when IRSA provides them — never invented for fixtures.
    `preview_url` is non-null only when a local FITS resolves (sample under
    data/samples/, fits_sample, data/raw/{obs_id}.fits, or a P4 fits_path
    already on disk). GET /api/preview/{obs_id} uses P5 inspect_fits +
    fits_to_png; otherwise 501 / null preview_url.
servers:
  - url: http://127.0.0.1:8000
    description: Local uvicorn
paths:
  /health:
    get:
      summary: Liveness
      operationId: getHealth
      tags: [system]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
  /api/targets:
    get:
      summary: Catálogo mínimo de test targets
      operationId: getTargets
      tags: [targets]
      responses:
        "200":
          description: Lista Target (labeled fixtures)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Target"
  /api/search:
    get:
      summary: Buscar por q y/o ra/dec
      operationId: search
      tags: [search]
      parameters:
        - in: query
          name: q
          schema:
            type: string
          description: Nombre o fragmento de target
        - in: query
          name: ra
          schema:
            type: number
            minimum: 0
            exclusiveMaximum: 360
          description: Right ascension (degrees) [0, 360)
        - in: query
          name: dec
          schema:
            type: number
            minimum: -90
            maximum: 90
          description: Declination (degrees) [-90, 90]
        - in: query
          name: radius_arcsec
          schema:
            type: number
            exclusiveMinimum: 0
            maximum: 3600
          description: Search radius in arcseconds (requires ra/dec)
      responses:
        "200":
          description: hits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "422":
          description: Validation error (RA/Dec/radius bounds or unpaired ra/dec)
  /api/epochs:
    get:
      summary: Visitas cerca de ra/dec (time-ordered)
      operationId: getEpochs
      tags: [epochs]
      parameters:
        - in: query
          name: ra
          required: true
          schema:
            type: number
            minimum: 0
            exclusiveMaximum: 360
        - in: query
          name: dec
          required: true
          schema:
            type: number
            minimum: -90
            maximum: 90
        - in: query
          name: radius_arcsec
          schema:
            type: number
            exclusiveMinimum: 0
            maximum: 3600
          description: Search radius in arcseconds
        - in: query
          name: band
          schema:
            type: string
          description: Optional bandpass filter
      responses:
        "200":
          description: epochs[] time-ordered by t_mjd
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpochsResponse"
        "422":
          description: Validation error (missing/out-of-range ra/dec/radius)
  /api/preview/{obs_id}:
    get:
      summary: Preview PNG (P5 fits_to_png + HDU inspect when local FITS exists)
      operationId: getPreview
      tags: [preview]
      parameters:
        - in: path
          name: obs_id
          required: true
          schema:
            type: string
        - in: query
          name: size
          schema:
            type: integer
            minimum: 1
            maximum: 4096
            default: 512
      responses:
        "200":
          description: image/png from local sample / cutout via P5 fits_to_png
          content:
            image/png:
              schema:
                type: string
                format: binary
          headers:
            X-Provenance:
              schema:
                type: string
                example: cached_sample
            X-Obs-Id:
              schema:
                type: string
            X-Source-Fits:
              schema:
                type: string
            X-Hdu-Index:
              schema:
                type: string
                description: HDU index selected by inspect_fits / select_image_hdu
        "501":
          description: No local FITS or processing failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StubNotImplemented"
components:
  schemas:
    Target:
      type: object
      required: [id, name, ra, dec]
      properties:
        id:
          type: string
        name:
          type: string
        ra:
          type: number
          description: Degrees
        dec:
          type: number
          description: Degrees
        notes:
          type: string
    SearchHit:
      type: object
      required: [id, name, ra, dec]
      properties:
        id:
          type: string
        name:
          type: string
        ra:
          type: number
        dec:
          type: number
        notes:
          type: string
    SearchResponse:
      type: object
      required: [hits, provenance]
      properties:
        hits:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"
        provenance:
          type: string
          enum: [stub, cached_sample, live]
          description: |
            stub / cached_sample = labeled fixtures; live = successful IRSA
            SIA2 query via P4 search_observations.
          example: stub
    Epoch:
      type: object
      required:
        [obs_id, ra, dec, t_mjd, bandpass, wavelength_um, preview_url, provenance]
      description: |
        Time-ordered visit near a sky region. Required keys are always present;
        t_mjd, bandpass, wavelength_um, preview_url, ra, and dec may be null
        when the fixture or IRSA row lacks that value.
        Field mapping from P4 ObservationRecord (live only):
          id → obs_id, t_min_mjd → t_mjd, band_label → bandpass,
          em_min/em_max → wavelength_um (midpoint µm when both present),
          access_url → source_url (optional), collection → collection (optional).
        collection / source_url are omitted on fixture rows; included on live
        rows only when P4/IRSA actually provided them. preview_url is non-null
        only when a local FITS resolves — clients should not request preview
        when it is null (endpoint would 501).
      properties:
        obs_id:
          type: string
        ra:
          type: number
          nullable: true
          description: Right ascension in degrees from fixture/IRSA when known
        dec:
          type: number
          nullable: true
          description: Declination in degrees from fixture/IRSA when known
        t_mjd:
          type: number
          nullable: true
          description: Observation time as MJD; null if unknown (sorted last)
        bandpass:
          type: string
          nullable: true
        wavelength_um:
          type: number
          nullable: true
        preview_url:
          type: string
          nullable: true
          description: /api/preview/{obs_id} when local FITS exists; else null
        provenance:
          type: string
          enum: [stub, cached_sample, live]
          description: |
            stub = synthetic labeled fixture; cached_sample = local sample
            metadata/FITS; live = real IRSA SIA2 row via P4.
        collection:
          type: string
          nullable: true
          description: |
            IRSA obs_collection when present on a live row (e.g. spherex_dr1).
            Omitted for fixtures — clients must not invent DR1/QR3.
        source_url:
          type: string
          nullable: true
          description: |
            IRSA access_url when present on a live row. Omitted for fixtures.
    EpochsResponse:
      type: object
      required: [epochs, provenance]
      properties:
        epochs:
          type: array
          items:
            $ref: "#/components/schemas/Epoch"
        provenance:
          type: string
          enum: [stub, cached_sample, live]
          example: cached_sample
    StubNotImplemented:
      type: object
      required: [detail, provenance]
      properties:
        detail:
          type: string
        provenance:
          type: string
          example: stub
